name: Chart data

# Traffic separation schemes, lighthouses and main buoys for the whole area. Weekly, plus a button to run it by hand.
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch chart extras
        run: python3 scripts/fetch_chartdata.py
      - name: Commit to main
        run: |
          git config user.name "FirstShift chart data job"
          git config user.email "forecasts@users.noreply.github.com"
          git add site/zones
          git diff --cached --quiet && echo "No change" || (git commit -q -m "Chart data $(date -u +%Y-%m-%d)" && git pull -q --rebase origin main && git push)
