name: Probe
# A small manual job, started by hand, to try a new data source from GitHub's network before adding it to the forecast job.
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL to fetch (first 4 kB shown)
        required: true
      grep:
        description: optional text to keep only lines matching it (with 3 lines after)
        required: false
        default: ''
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch
        env:
          URL: ${{ github.event.inputs.url }}
          GREP: ${{ github.event.inputs.grep }}
        run: |
          curl -sS -L --max-time 120 -w '\nHTTP %{http_code}, %{size_download} bytes\n' "$URL" > out.txt || true
          if [ -n "$GREP" ]; then grep -A3 -e "$GREP" -e '^HTTP ' out.txt | head -c 8000; else head -c 4000 out.txt; echo; tail -n 2 out.txt; fi
