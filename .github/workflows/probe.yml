name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy eccodes eccodeslib
      - name: Fetch AROME and ARPEGE for the Channel box
        run: |
          R=$(date -u -d '-9 hours' +%Y%m%d)$(printf '%02d' $(( ($(date -u -d '-9 hours' +%-H)/6)*6 ))); echo run $R
          for s in arome arpege; do FS_DATA=work/probe FS_RUN=$R FS_HOURS=60 FS_BOX="48.4,51.0,-5.3,1.7" timeout 1200 python3 scripts/fetch.py $s 2>&1 | tail -3; done
          python3 -c "import numpy as np;[print(s, {k: np.load('work/probe/'+s+'.npz')[k].shape for k in ('u','hours','lat','lon')}, np.load('work/probe/'+s+'.npz')['hours'][[0,-1]], float(np.nanmax(np.hypot(np.load('work/probe/'+s+'.npz')['u'],np.load('work/probe/'+s+'.npz')['v'])))) for s in ('arome','arpege')]"
