name: Forecasts

# Every six hours, about seven hours after each 00, 06, 12 and 18 UTC model run, plus a button to run it by hand.
# The areas are fetched side by side, one job each (12 Nov 2026: one after another took over three hours with seven areas).
on:
  schedule:
    # 23 Nov 2026 (Stuart 20:17): the forecast clock starts the runs at 01:45, 07:45, 13:45 and 19:45, after ECMWF's 00Z and 12Z land on
    # the AWS copy (07:34 and 19:34 UTC); GitHub's own schedule is the back-up, an hour later, and stands down if the clock's run published
    - cron: '17 2,8,14,20 * * *'
    # back-up: GitHub sometimes skips a scheduled run; these rebuild only if nothing was published for 5 hours
    - cron: '47 2,8,14,20 * * *'
    # 24 Nov 2026 (Stuart 10:02, "add server run"): an early-morning run for the 00Z runs that are out by then (AROME HD, ICON-EU), so phones
    # have them before most starts; the forecast clock starts it at 04:45 (Cloudflare cron 45 4 * * *), this is its back-up
    - cron: '47 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: do everything but publish and ping (to time a change on a test branch)'
        type: boolean
        default: false
      only:
        description: 'F4: only these models (comma list, e.g. gfs,icon); every other layer is carried across from the live pack. Empty: all models'
        type: string
        default: ''

env:
  FS_ONLY: ${{ inputs.only }}

permissions:
  contents: write
  actions: read   # F6: the gate looks for a waiting or running requested run

concurrency:
  group: forecasts${{ inputs.dry_run && '-dry' || '' }}${{ github.event_name == 'schedule' && '-sched' || '' }}   # F6 (Stuart 25 Nov 15:30): GitHub keeps one waiting run per queue, so a scheduled run that would stand down used to cancel a waiting requested run (25 Nov 11:12, 21 Nov); scheduled runs now queue on their own, and their gate stands down if any other run is waiting or under way   # a dry run publishes nothing, so it has its own queue (a waiting dry run was cancelled by the next scheduled run, 21 Nov)
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.fresh.outputs.skip }}
    steps:
      - name: Skip a scheduled run if the last publish is recent (the forecast clock or an earlier run did it)
        id: fresh
        run: |
          # 21 Nov: the Cloudflare forecast clock (cloudflare/forecast-clock) starts runs on time; GitHub's own schedule is the back-up, so any
          # scheduled run, not only the :47 one, stands down when forecasts were published in the last 3 hours (runs are 6 hours apart, so a late earlier run never stops the next)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            built=$(curl -fsS https://firstshift-route.pages.dev/status.json | python3 -c "import json,sys,calendar,time;print(calendar.timegm(time.strptime(json.load(sys.stdin)['built'],'%Y-%m-%dT%H:%MZ')))" || echo 0)
            age=$(( $(date -u +%s) - built ))
            if [ "$age" -lt 10800 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "Published $((age/60)) min ago: nothing to do"; fi
            busy=$(curl -fsS -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/forecast.yml/runs?per_page=10" | python3 -c "import json,sys;print(sum(1 for r in json.load(sys.stdin)['workflow_runs'] if r['status'] in ('queued','in_progress','waiting','pending') and r['id'] != ${{ github.run_id }} and r['event'] != 'schedule'))" || echo 0)
            if [ "$busy" != "0" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "A requested run is waiting or under way: this scheduled run stands down"; fi
          fi
      - name: Tell Healthchecks.io a run has started (monitoring plan step 2)
        if: steps.fresh.outputs.skip != '1'
        env:
          HC: ${{ secrets.HC_PING_URL || 'https://hc-ping.com/e66f00bb-7e1b-4b78-8b83-443aed0262fd' }}   # Stuart 21 Nov 02:55: "Put in public code" (a repository secret HC_PING_URL, if added, takes over)
        run: '[ -z "$HC" ] || [ "${{ inputs.dry_run }}" = "true" ] || curl -fsS -m 10 --retry 3 -o /dev/null "$HC/start" || true'

  # 21 Nov 2026: the ECMWF family once for every area (the 08:19 UTC run had eight jobs download the same fields at once and waited 50 minutes)
  shared:
    needs: gate
    if: needs.gate.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install numpy numcodecs eccodes eccodeslib netCDF4 pyproj tifffile
      - name: Fetch ECMWF IFS, AIFS, weather, waves and the ensemble once, for one box round every area
        run: python3 scripts/fetch_shared.py
      - uses: actions/upload-artifact@v4
        with:
          name: shared
          path: work/_shared
          retention-days: 1
          compression-level: 0

  area:
    needs: [gate, shared]
    if: always() && needs.gate.outputs.skip != '1'   # if the shared job fails, each area fetches the ECMWF family itself, as before
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        area: [cervantes, fastnet, channel-area, northsea-area, irishsea-area, biscay-area, celtic-area, solent-area, tasman-area]   # solent-area: Mark's own small pack (Stuart 18 Nov 19:30)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install numpy numcodecs eccodes eccodeslib netCDF4 pyproj tifffile
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: shared
          path: work/_shared
      - name: Fetch forecasts and build the pack for ${{ matrix.area }}
        env:
          FS_STATUS_PART: status-${{ matrix.area }}.json
          FS_SHARED: work/_shared
        run: |
          # the on/off switch (config/areas.json, 21 Nov 2026): an area switched off keeps its last forecasts and costs no server time
          if [ "$(python3 -c "import json;print(json.load(open('config/areas.json')).get('${{ matrix.area }}','on'))" 2>/dev/null || echo on)" = off ]; then echo "${{ matrix.area }} is switched off"; exit 0; fi
          python3 scripts/build.py ${{ matrix.area }}
      - uses: actions/upload-artifact@v4
        with:
          name: area-${{ matrix.area }}
          path: |
            site/${{ matrix.area }}/pack
            site/status-${{ matrix.area }}.json
          retention-days: 1
          compression-level: 0

  publish:
    needs: [gate, area]
    if: always() && needs.gate.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the newest app, not the commit the run started from (14 Nov 2026: a run that started before a release put the older app back live)
      - name: Start from what is live, so an area whose fetch failed keeps its last forecasts
        run: |
          git fetch -q origin site || true
          mkdir -p prev && (git archive origin/site | tar -x -C prev) || echo "no site branch yet"
          for d in prev/*/; do n=$(basename "$d"); [ -d "prev/$n/pack" ] && mkdir -p "site/$n" && cp -r "prev/$n/pack" "site/$n/" || true; done
          [ -f prev/status.json ] && cp prev/status.json site/status-previous.json || true
      - uses: actions/download-artifact@v4
        with:
          pattern: area-*
          path: new
      - name: Lay the new packs over the old
        run: |
          for a in new/area-*; do n=${a#new/area-}; if [ -d "$a/$n/pack" ]; then rm -rf "site/$n/pack"; mkdir -p "site/$n"; cp -r "$a/$n/pack" "site/$n/"; echo "new forecasts: $n"; else echo "kept the last forecasts: $n"; fi; cp "$a"/status-*.json site/ 2>/dev/null || true; done
          python3 - <<'PY'
          import json, glob, os, time
          prev = {}
          try: prev = json.load(open('site/status-previous.json'))
          except Exception: pass
          src = dict(prev.get('sources', {})); rec = dict(prev.get('received', {}))
          for f in sorted(glob.glob('site/status-*.json')):
              if f.endswith('status-previous.json'): continue
              j = json.load(open(f)); src.update(j.get('sources', {})); rec.update(j.get('received', {}))
          json.dump(dict(built=time.strftime('%Y-%m-%dT%H:%MZ', time.gmtime()), sources=src, received=rec), open('site/status.json', 'w'), indent=1)
          for f in glob.glob('site/status-*.json'): os.remove(f)
          PY
      - name: A model whose newest run failed keeps its last good run, marked as older
        run: python3 scripts/keep_old_layers.py prev site || echo "could not keep older runs"
      - name: Use the newest app from main (a change pushed while this job ran must not be overwritten)
        run: |
          git fetch -q origin main
          git archive origin/main site/cervantes site/index.html site/courses site/functions site/help site/helpmedia site/brand site/route.webmanifest site/_routes.json site/follow site/zones site/android tools/compact.js _headers | tar -x
          for d in fastnet channel-area northsea-area irishsea-area biscay-area celtic-area tasman-area mark; do mkdir -p "site/$d"; cp site/cervantes/*.js site/cervantes/*.css site/cervantes/*.woff2 site/cervantes/index.html "site/$d/"; done
          # Mark (17 Nov 18:40: Mark went missing from the live site at the 15:45 run, as this list left it out); F28 compacted code with FirstShift's notice
          npm i --no-save terser@5.31.6 >/dev/null 2>&1 && for d in cervantes fastnet channel-area northsea-area irishsea-area biscay-area celtic-area tasman-area mark; do TERSER=$PWD/node_modules/terser node tools/compact.js "site/$d"; done || echo "code not compacted this run"
      - name: Publish to the site branch
        run: |
          cp _headers site/_headers
          cd site
          rm -rf .git && git init -q -b site
          git config user.name "FirstShift forecast job"
          git config user.email "forecasts@users.noreply.github.com"
          git add -A
          git commit -q -m "Forecasts $(date -u +%Y-%m-%dT%H:%MZ)"
          if [ "${{ inputs.dry_run }}" = "true" ]; then echo "dry run: not published"; exit 0; fi
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site:site
      - name: Keep the site just published for the pre-route jobs (a dry run publishes nothing, so they read it from here)
        uses: actions/upload-artifact@v4
        with:
          name: site-built
          path: |
            site
            !site/.git
          retention-days: 1
          compression-level: 0

  # F100 (Stuart 21 Nov 07:22 and 07:44: the work done off the phone must be there when it is wanted; the 02:24 run of 21 Nov stopped
  # after 75 minutes, one race after another, mid-Fastnet, with Cervantes and the extra races never reached and the Fastnet's four
  # finished starts thrown away). Each race now has its own job, side by side, with its own time limit; the slow Fastnet is split by
  # start time over three jobs; every start is saved as it finishes, so a job stopped by its limit still hands over what it finished.
  preroute:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - { name: channel-area, args: channel-area, limit: 30 }
          - { name: northsea-area, args: northsea-area, limit: 35 }
          - { name: irishsea-area, args: irishsea-area, limit: 20 }
          - { name: biscay-area, args: biscay-area, limit: 30 }
          - { name: celtic-area, args: celtic-area, limit: 35 }
          - { name: fastnet-1, args: 'fastnet@0-1', limit: 35 }
          - { name: fastnet-2, args: 'fastnet@2-3', limit: 40 }
          - { name: fastnet-3, args: 'fastnet@4-5', limit: 40 }
          - { name: cervantes, args: cervantes, limit: 30 }
          # the Channel Race and the De Guingand Bowl are set on the day (no marks until the sailing instructions): nothing to pre-route (21 Nov dry run: 25 min for nothing)
          - { name: myth, args: 'channel-area:myth', limit: 30 }
          - { name: morgan, args: 'channel-area:morgan', limit: 30 }
          - { name: dinard, args: 'channel-area:dinard', limit: 30 }
          - { name: cherbourg, args: 'channel-area:cherbourg', limit: 30 }
          - { name: northsea, args: 'northsea-area:northsea', limit: 30 }
    steps:
      - uses: actions/checkout@v4   # the scripts of this run's commit (main on a schedule); the app comes from the site just built
      - uses: actions/download-artifact@v4
        with:
          name: site-built
          path: site
      - name: Install the browser
        run: |
          npm i --no-save playwright@1.47.2
          npx playwright install chromium || true
          npx playwright install-deps chromium || echo 'system packages not refreshed; using what the runner has'
      - name: Pre-route ${{ matrix.args }}
        continue-on-error: true
        timeout-minutes: ${{ matrix.limit }}
        run: PRE_HOURS=6 PRE_HOURS_RACE=3 node scripts/preroute.js site ${{ matrix.args }}
      - name: Hand over the starts routed (also after the time limit)
        if: always()
        run: |
          mkdir -p out; for d in site/*/pre; do [ -f "$d/routes.json" ] && { n=$(basename "$(dirname "$d")"); mkdir -p "out/$n"; cp -r "$d" "out/$n/"; echo "$n: $(ls "$d" | grep -c '^s.*\.json$') start files"; }; done; true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pre-${{ matrix.name }}
          path: out
          retention-days: 1
          if-no-files-found: ignore

  collect:
    needs: [area, publish, preroute]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4   # the scripts of this run's commit (main on a schedule); the app comes from the site just built
      - uses: actions/download-artifact@v4
        with:
          name: site-built
          path: site
      - uses: actions/download-artifact@v4
        with:
          pattern: pre-*
          path: pre
      - name: Lay every race's pre-routes over the site, only those built on these forecasts
        run: python3 scripts/premerge.py site pre | tee premerge.txt
      - name: Use the newest app from main again before the second publish
        run: |
          git fetch -q origin main
          git archive origin/main site/cervantes site/index.html site/courses site/functions site/help site/helpmedia site/brand site/route.webmanifest site/_routes.json site/follow site/zones site/android tools/compact.js _headers | tar -x
          for d in fastnet channel-area northsea-area irishsea-area biscay-area celtic-area tasman-area mark; do mkdir -p "site/$d"; cp site/cervantes/*.js site/cervantes/*.css site/cervantes/*.woff2 site/cervantes/index.html "site/$d/"; done
          npm i --no-save terser@5.31.6 >/dev/null 2>&1 && for d in cervantes fastnet channel-area northsea-area irishsea-area biscay-area celtic-area tasman-area mark; do TERSER=$PWD/node_modules/terser node tools/compact.js "site/$d"; done || echo "code not compacted this run"
      - name: Publish again with the pre-routes
        if: inputs.dry_run != true
        run: |
          cd site
          rm -rf .git && git init -q -b site
          git config user.name "FirstShift forecast job"
          git config user.email "forecasts@users.noreply.github.com"
          git add -A
          git commit -q -m "Forecasts and pre-routes $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site:site
      - name: Check the live site matches main (Route, Mark, and the Route+ and Mark+ downloads)
        if: always() && inputs.dry_run != true
        # 20 Nov: a release that reached the live site but not main was undone by the next run, unnoticed. This fails the job, and GitHub emails, if they differ.
        run: |
          git fetch -q origin main && git checkout -q origin/main -- tools/live_check.js site/cervantes/app.js site/android
          node tools/live_check.js https://firstshift-route.pages.dev --wait 10
      - name: Tell Healthchecks.io how the run ended (fail if any area failed, any step failed, or a race has no pre-routes)
        if: always() && inputs.dry_run != true
        env:
          HC: ${{ secrets.HC_PING_URL || 'https://hc-ping.com/e66f00bb-7e1b-4b78-8b83-443aed0262fd' }}   # Stuart 21 Nov 02:55: "Put in public code" (a repository secret HC_PING_URL, if added, takes over)
          AREAS: ${{ needs.area.result }}
          JOB: ${{ job.status }}
        run: |
          [ -z "$HC" ] && { echo "HC_PING_URL not set: no ping"; exit 0; }
          MISSING=$(grep '^MISSING' premerge.txt 2>/dev/null | tr '\n' ' ')
          if [ "$JOB" = "success" ] && [ "$AREAS" = "success" ] && [ -z "$MISSING" ]; then curl -fsS -m 10 --retry 3 -o /dev/null "$HC" || true
          else curl -fsS -m 10 --retry 3 -o /dev/null --data-raw "collect: $JOB, areas: $AREAS, $MISSING run ${{ github.run_id }}" "$HC/fail" || true; fi
