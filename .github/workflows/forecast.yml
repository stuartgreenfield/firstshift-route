name: Forecasts

# Every six hours, about seven hours after each 00, 06, 12 and 18 UTC model run, plus a button to run it by hand.
# The areas are fetched side by side, one job each (12 Nov 2026: one after another took over three hours with seven areas).
on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
    # back-up: GitHub sometimes skips a scheduled run; these rebuild only if nothing was published for 5 hours
    - cron: '47 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecasts
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.fresh.outputs.skip }}
    steps:
      - name: Skip a back-up run if the last publish is recent
        id: fresh
        run: |
          if [ "${{ github.event.schedule }}" = "47 1,7,13,19 * * *" ]; then
            built=$(curl -fsS https://firstshift-route.pages.dev/status.json | python3 -c "import json,sys,calendar,time;print(calendar.timegm(time.strptime(json.load(sys.stdin)['built'],'%Y-%m-%dT%H:%MZ')))" || echo 0)
            age=$(( $(date -u +%s) - built ))
            if [ "$age" -lt 18000 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "Published $((age/60)) min ago: nothing to do"; fi
          fi

  area:
    needs: gate
    if: needs.gate.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        area: [cervantes, fastnet, channel-area, northsea-area, irishsea-area, biscay-area, celtic-area]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install numpy numcodecs eccodes eccodeslib netCDF4 pyproj tifffile
      - name: Fetch forecasts and build the pack for ${{ matrix.area }}
        env:
          FS_STATUS_PART: status-${{ matrix.area }}.json
        run: python3 scripts/build.py ${{ matrix.area }}
      - uses: actions/upload-artifact@v4
        with:
          name: area-${{ matrix.area }}
          path: |
            site/${{ matrix.area }}/pack
            site/status-${{ matrix.area }}.json
          retention-days: 1
          compression-level: 0

  publish:
    needs: [gate, area]
    if: always() && needs.gate.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Start from what is live, so an area whose fetch failed keeps its last forecasts
        run: |
          git fetch -q origin site || true
          mkdir -p prev && (git archive origin/site | tar -x -C prev) || echo "no site branch yet"
          for d in prev/*/; do n=$(basename "$d"); [ -d "prev/$n/pack" ] && mkdir -p "site/$n" && cp -r "prev/$n/pack" "site/$n/" || true; done
          [ -f prev/status.json ] && cp prev/status.json site/status-previous.json || true
      - uses: actions/download-artifact@v4
        with:
          pattern: area-*
          path: new
      - name: Lay the new packs over the old
        run: |
          for a in new/area-*; do n=${a#new/area-}; if [ -d "$a/$n/pack" ]; then rm -rf "site/$n/pack"; mkdir -p "site/$n"; cp -r "$a/$n/pack" "site/$n/"; echo "new forecasts: $n"; else echo "kept the last forecasts: $n"; fi; cp "$a"/status-*.json site/ 2>/dev/null || true; done
          python3 - <<'PY'
          import json, glob, os, time
          prev = {}
          try: prev = json.load(open('site/status-previous.json'))
          except Exception: pass
          src = dict(prev.get('sources', {})); rec = dict(prev.get('received', {}))
          for f in sorted(glob.glob('site/status-*.json')):
              if f.endswith('status-previous.json'): continue
              j = json.load(open(f)); src.update(j.get('sources', {})); rec.update(j.get('received', {}))
          json.dump(dict(built=time.strftime('%Y-%m-%dT%H:%MZ', time.gmtime()), sources=src, received=rec), open('site/status.json', 'w'), indent=1)
          for f in glob.glob('site/status-*.json'): os.remove(f)
          PY
      - name: A model whose newest run failed keeps its last good run, marked as older
        run: python3 scripts/keep_old_layers.py prev site || echo "could not keep older runs"
      - name: Use the newest app from main (a change pushed while this job ran must not be overwritten)
        run: |
          git fetch -q origin main
          git archive origin/main site/cervantes site/index.html site/courses site/functions site/help site/brand site/route.webmanifest site/follow site/zones _headers | tar -x
          for d in fastnet channel-area northsea-area irishsea-area biscay-area celtic-area; do mkdir -p "site/$d"; cp site/cervantes/*.js site/cervantes/index.html "site/$d/"; done
      - name: Publish to the site branch
        run: |
          cp _headers site/_headers
          cd site
          rm -rf .git && git init -q -b site
          git config user.name "FirstShift forecast job"
          git config user.email "forecasts@users.noreply.github.com"
          git add -A
          git commit -q -m "Forecasts $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site:site
      - name: Pre-route each race for the standard settings
        continue-on-error: true
        timeout-minutes: 75
        run: |
          npm i --no-save playwright@1.47.2
          npx playwright install chromium || true
          npx playwright install-deps chromium || echo 'system packages not refreshed; using what the runner has'
          PRE_HOURS=6 PRE_HOURS_RACE=3 node scripts/preroute.js site channel-area channel-area:myth channel-area:deguingand channel-area:morgan channel-area:dinard channel-area:channel channel-area:cherbourg northsea-area northsea-area:northsea irishsea-area biscay-area celtic-area fastnet cervantes
      - name: Use the newest app from main again before the second publish
        run: |
          git fetch -q origin main
          git archive origin/main site/cervantes site/index.html site/courses site/functions site/help site/brand site/route.webmanifest site/follow site/zones _headers | tar -x
          for d in fastnet channel-area northsea-area irishsea-area biscay-area celtic-area; do mkdir -p "site/$d"; cp site/cervantes/*.js site/cervantes/index.html "site/$d/"; done
      - name: Publish again with the pre-routes
        run: |
          cd site
          rm -rf .git && git init -q -b site
          git config user.name "FirstShift forecast job"
          git config user.email "forecasts@users.noreply.github.com"
          git add -A
          git commit -q -m "Forecasts and pre-routes $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site:site
