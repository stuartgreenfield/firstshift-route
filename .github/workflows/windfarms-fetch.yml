name: Wind farms fetch
# One-off helper on its own branch: builds windfarms.json from EMODnet on GitHub's network and commits it back to this branch. Not on main; changes nothing live.
on:
  push:
    branches: [windfarms-fetch]
    paths: ['.github/workflows/windfarms-fetch.yml', 'tools/make_windfarms.py']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 tools/make_windfarms.py site/zones/windfarms.json && ls -la site/zones/windfarms.json && sha256sum site/zones/windfarms.json
      - name: Hand it back
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/zones/windfarms.json && git commit -qm "Wind farm outlines from EMODnet (built on GitHub's network)" && git push -q
